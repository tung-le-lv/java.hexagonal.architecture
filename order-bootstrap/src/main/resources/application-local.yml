# Run with --spring.profiles.active=local to start against an in-memory database and no external
# infrastructure. Useful for exercising the HTTP API by hand.
spring:
  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

logging:
  level:
    com.acme.orders: DEBUG
