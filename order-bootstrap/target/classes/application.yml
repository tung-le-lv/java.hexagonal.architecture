spring:
  application:
    name: order-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
    hikari:
      pool-name: orders-pool
      maximum-pool-size: 10

  jpa:
    open-in-view: false          # no lazy loading outside the transaction boundary the port defines
    hibernate:
      ddl-auto: none             # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    # Jackson 3 writes java.time values as ISO-8601 by default, so the old
    # write-dates-as-timestamps flag is both gone and no longer needed.
    default-property-inclusion: non_null

orders:
  discount:
    currency: EUR
    # Which tiers apply is a deployment decision; the policy that interprets them lives in the domain.
    tiers:
      - threshold: 500.00
        percentage: 10
      - threshold: 200.00
        percentage: 5
  outbox:
    relay:
      enabled: true
      batch-size: 50
      interval: PT5S

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never       # errors are shaped by RestExceptionHandler, not by the container

logging:
  level:
    com.acme.orders: INFO
